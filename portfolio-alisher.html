<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Ежелгі санау жүйелері</title>
<meta name="description" content="«Зерде» жобасы: бес ежелгі санау жүйесінің интерактивті зертханасы">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap">
<style>/* Layout: one reading column with full-width "bands" per section; the presentation's navy + warm orange identity carries over. */
[hidden]{display:none!important}
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#16263d; --mute:#5d6a7a; --line:#e3dccd;
  --navy:#183152; --accent:#d9662a; --on-navy:#f7f3ea;
  --c-dec:#1f5fa8; --c-rom:#7a3e8e; --c-egy:#b07a12; --c-may:#1d8a6b; --c-bab:#b2492f;
  --ok:#1d8a4b;
  --display:"PT Serif",Georgia,"Times New Roman",serif;
  --body:"PT Sans","Segoe UI",system-ui,sans-serif;
  --mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1a2b; --card:#15243a; --ink:#eef1f5; --mute:#9fb0c4; --line:#263a55;
  --navy:#0a1422; --accent:#f08a4b; --on-navy:#eef1f5;
  --c-dec:#6fa8ff; --c-rom:#c58ad8; --c-egy:#e6b54a; --c-may:#4fd1a8; --c-bab:#f08a6e; --ok:#4fd18a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1a2b; --card:#15243a; --ink:#eef1f5; --mute:#9fb0c4; --line:#263a55;
  --navy:#0a1422; --accent:#f08a4b; --on-navy:#eef1f5;
  --c-dec:#6fa8ff; --c-rom:#c58ad8; --c-egy:#e6b54a; --c-may:#4fd1a8; --c-bab:#f08a6e; --ok:#4fd18a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,4.4vw,38px)}
h3{font-size:19px}
p{margin:0;max-width:68ch}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--mute);font-size:14px;padding:6px 10px;border-radius:99px}
.nav a:hover{color:var(--ink);background:var(--line)}
.tools{display:flex;gap:6px;flex:none}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700}
.pill.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
/* sections */
section{padding-block:64px;border-bottom:1px solid var(--line)}
section.band{background:var(--navy);color:var(--on-navy);border:0}
section.band .mute{color:color-mix(in srgb,var(--on-navy) 72%,transparent)}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.band .card{background:color-mix(in srgb,var(--on-navy) 7%,transparent);border-color:color-mix(in srgb,var(--on-navy) 16%,transparent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:10px 18px}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn:disabled{opacity:.4;cursor:default}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* hero / converter */
.hero h1{font-size:clamp(34px,6.5vw,64px);max-width:15ch}
.hero .q{font-size:clamp(18px,2.4vw,22px);color:var(--mute);max-width:52ch}
.big-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.big-in input{font:700 clamp(40px,8vw,72px)/1 var(--mono);width:min(100%,8.5ch);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 16px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font:600 14px var(--mono)}
.kzw{margin-top:12px;font-size:18px}
.kzw b{font-family:var(--display)}
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px;margin-top:26px}
.sc{display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c);}
.sc .nm{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.sc .nm span:last-child{color:var(--mute);font-weight:400}
.sc .gw{min-height:96px;display:flex;align-items:center;justify-content:center;color:var(--c);padding:6px 0;overflow-x:auto}
.sc .cnt{font:700 30px/1 var(--mono);color:var(--c)}
.sc .cnt small{font:400 13px var(--body);color:var(--mute);margin-left:4px}
.sc .meta{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.sc .na{font-size:13px;color:var(--mute);text-align:center}
.race{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.rb{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.rb i{display:block;height:14px;border-radius:7px;background:var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.rb b{font-family:var(--mono);text-align:right}
details.how{margin-top:18px}
details.how summary{cursor:pointer;font-weight:700;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.steps table{font:14px var(--mono)}
/* glyphs */
.gl{display:block;flex:none}
.gg{display:inline-grid;gap:3px 4px;align-items:end;justify-items:center}
.egy{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.bab{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.bplace{display:flex;gap:4px;align-items:center;padding:2px 4px}
.may{display:flex;flex-direction:column;gap:8px;align-items:center}
.mplace{display:flex;flex-direction:column;gap:4px;align-items:center;padding:4px 8px;border-bottom:1px dashed color-mix(in srgb,currentColor 35%,transparent)}
.mplace:last-child{border-bottom:0}
.txt{font-family:var(--display);font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere;text-align:center}
.txt.dec{font-size:44px;font-family:var(--mono)}
.txt.rom{font-size:30px}
.zero{opacity:.8}
/* keyboard */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:700}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.kbd{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media(max-width:760px){.kbd{grid-template-columns:1fr}}
.kb-out{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:220px;color:var(--c)}
.kb-out .val{font:700 48px/1 var(--mono);color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--c)}
.key small{color:var(--mute);font:600 12px var(--mono)}
.key:active{transform:translateY(2px)}
.plc{display:flex;flex-direction:column;gap:6px;border:1.5px dashed var(--line);border-radius:12px;padding:10px}
.toast{min-height:22px;font-size:14px;color:var(--accent);font-weight:700;text-align:center}
/* study */
.slider{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
input[type=range]{width:100%;accent-color:var(--accent)}
.bigN{font:700 clamp(30px,5vw,46px)/1 var(--mono)}
.tbl{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ok) 13%,var(--card));color:var(--ink);font-size:15px}
.verdict b{color:var(--ok)}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:12px var(--body)}
.chart .hl{fill:var(--accent)}
.chart .bar{fill:color-mix(in srgb,var(--c-dec) 45%,transparent)}
.chart .grid{stroke:var(--line)}
.chart .mark{fill:var(--ok)}
.band .chart text{fill:color-mix(in srgb,var(--on-navy) 70%,transparent)}
.band .chart .grid{stroke:color-mix(in srgb,var(--on-navy) 18%,transparent)}
.band .chart .bar{fill:color-mix(in srgb,var(--on-navy) 35%,transparent)}
.basev{font:700 22px var(--mono);overflow-wrap:anywhere}
/* clock */
.clock{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tri{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;color:var(--c-bab);min-height:110px}
.tri>div,.lc>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.tri small,.lc small{font:12px var(--mono);color:var(--mute)}
.lc{display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap;color:var(--c-may)}
.sep{font:700 28px var(--mono);color:var(--mute)}
/* experiment */
.task{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.task .prob{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--c);font:700 28px var(--display)}
.ans{min-height:64px;min-width:200px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;color:var(--c)}
.timer{font:700 20px var(--mono)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* wheel */
.wheel-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
@media(max-width:760px){.wheel-wrap{grid-template-columns:1fr}}
#wheelSvg{width:100%;max-width:420px;margin:0 auto;display:block;touch-action:none;cursor:grab}
#wheelSvg text{font:700 16px var(--mono);fill:var(--ink)}
.wsys{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wsys .card{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--c);min-height:120px;justify-content:center}
.wsys .card>span:last-child{font-size:12px;color:var(--mute)}
/* card */
.cardgen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media(max-width:760px){.cardgen{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mute)}
.fld input{font-size:17px;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
#cardPrev{width:100%;height:auto;border-radius:14px;box-shadow:0 10px 30px rgb(0 0 0/.18)}
/* author */
.hero-au{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:600px){.hero-au{grid-template-columns:1fr;justify-items:start}}
.au-photo{width:200px;height:200px;max-width:100%;border-radius:50%;overflow:hidden;border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--on-navy) 8%,transparent);font:700 84px var(--display);color:var(--accent)}
.au-photo img{width:100%;height:100%;object-fit:cover}
.au-name{font:700 clamp(30px,5vw,46px)/1.05 var(--display)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}@media(max-width:420px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{border:1px solid color-mix(in srgb,var(--on-navy) 18%,transparent);border-radius:12px;padding:10px 12px}
.fact b{display:block;font:700 28px/1.1 var(--mono);color:var(--accent)}
.fact span{font-size:13px;color:color-mix(in srgb,var(--on-navy) 75%,transparent)}
.story p{max-width:none}
.quote{margin:0;padding:18px 22px;border-left:4px solid var(--accent);font:italic 700 clamp(18px,2.6vw,24px)/1.35 var(--display)}
.quote small{display:block;margin-top:6px;font:400 14px var(--body);color:color-mix(in srgb,var(--on-navy) 70%,transparent)}
.band .data th,.band .data td{border-bottom-color:color-mix(in srgb,var(--on-navy) 15%,transparent)}
.band .data th{color:color-mix(in srgb,var(--on-navy) 65%,transparent)}
.band .tl{border-left-color:color-mix(in srgb,var(--on-navy) 20%,transparent)}
.band .tl time{color:color-mix(in srgb,var(--on-navy) 65%,transparent)}
.band .ph{border-color:color-mix(in srgb,var(--on-navy) 25%,transparent);color:color-mix(in srgb,var(--on-navy) 70%,transparent)}
.chipsI{display:flex;flex-wrap:wrap;gap:8px}
.chipsI span{border:1px solid color-mix(in srgb,var(--on-navy) 25%,transparent);border-radius:99px;padding:5px 12px;font-size:14px}
/* cover */
.cover{padding-block:48px 56px}
.cv-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:32px;align-items:center}
@media(max-width:820px){.cv-grid{grid-template-columns:1fr}}
.cover h1{font-size:clamp(34px,6vw,60px);max-width:14ch}
.cv-lead{font-size:clamp(17px,2vw,19px);max-width:56ch}
.cv-au{background:var(--navy);color:var(--on-navy);border-radius:20px;padding:20px 20px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.cv-portrait{width:100%;max-width:330px;aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:3px solid var(--accent);box-shadow:0 18px 40px rgb(0 0 0/.35)}.cv-portrait img{width:100%;height:100%;object-fit:cover;display:block}
.cv-au{--c-dec:#6fa8ff;--c-rom:#d7a6e6;--c-egy:#f0c45c;--c-may:#5fe0b8;--c-bab:#ff9a7f}
.cv48{display:grid;grid-template-columns:80px 1fr 32px;align-items:center;gap:10px;width:100%;max-width:330px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--on-navy) 15%,transparent);text-align:left;font-size:14px}.cv48 .g{color:var(--c);display:flex;justify-content:center;transform:scale(.8)}.cv48 b{font-family:var(--mono);color:var(--c);text-align:right}
.cv-sup{display:flex;gap:12px;align-items:center;text-align:left;width:100%;max-width:330px;margin-top:6px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--on-navy) 18%,transparent)}
.cv-sup img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex:none}
.cv-sup div{display:flex;flex-direction:column;gap:2px;min-width:0}.cv-sup b{font:700 15px/1.25 var(--display)}.cv-sup span:last-child{font-size:13px;color:color-mix(in srgb,var(--on-navy) 75%,transparent)}
.sup-row{display:flex;gap:10px;align-items:center}.sup-row img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex:none}.sup-row small{opacity:.75}
.cv-au .au-photo{width:170px;height:170px;font-size:72px}
.cv-au .nm{font:700 28px/1.1 var(--display)}
.cv-au .sub{font-size:15px;color:color-mix(in srgb,var(--on-navy) 78%,transparent)}
.cv-au .role{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.cv-res{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:22px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.cv-res b{font:700 clamp(28px,4vw,40px)/1 var(--mono)}
.cv-res .vs{color:var(--mute);font:700 20px var(--display)}
.cv-res p{flex:1;min-width:200px;font-size:15px;color:var(--mute)}
.cv-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;margin-top:34px}
.cv-tile{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;transition:border-color .15s,transform .15s}
.cv-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.cv-tile i{font-style:normal;flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:700 18px var(--mono)}
.cv-tile span{font-size:15px;line-height:1.4}
.cv-tile b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
/* about */
.qh{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.qh .card b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.formula{font:700 clamp(18px,3vw,26px) var(--display);text-align:center;padding:18px;border:2px solid var(--accent);border-radius:14px}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl>div{position:relative;padding:0 0 16px 20px}
.tl>div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl time{font:700 13px var(--mono);color:var(--mute)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ph{aspect-ratio:4/3;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--mute);font-size:14px;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ach{display:flex;flex-direction:column;gap:8px}
.ach div{display:flex;gap:10px;align-items:baseline}
.ach b{font-family:var(--mono);color:var(--accent);white-space:nowrap}
footer{padding-block:40px;font-size:14px}
/* QR overlay */
.ov{position:fixed;inset:0;background:rgb(10 20 34/.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.qrbox{background:#fff;padding:14px;border-radius:12px;width:min(320px,75vw)}
.qrbox svg{width:100%;height:auto;display:block}

.ph>div{display:flex;flex-direction:column;align-items:center;gap:4px}
@media(max-width:600px){.brand{display:none}.sc .gw{min-height:80px}}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

 for(const s of SYS){if(N>LIMIT[s]){r[s]=null;continue}let sym=0,pl=0;
  if(s==='dec'){for(let n=1;n<=N;n++){const l=n<10?1:n<100?2:n<1e3?3:n<1e4?4:n<1e5?5:n<1e6?6:7;sym+=l;pl+=l}}

function gsz(svg){const m=svg.match(/width="([\d.]+)" height="([\d.]+)"/);return[+m[1],+m[2]]}
function place(svg,x,y,col){return svg.replace('<svg ',`<svg x="${x}" y="${y}" `).replace(/currentColor/g,col)}
function block(fn,k,maxc,col){const s=fn(),[w,h]=gsz(s),cols=k<=maxc?k:Math.ceil(k/2),rows=Math.ceil(k/cols),gp=4;let out='',i=0;
 for(let r=0;r<rows;r++)for(let c=0;c<cols&&i<k;c++,i++)out+=place(s,c*(w+gp),r*(h+gp),col);return{w:cols*w+(cols-1)*gp,h:rows*h+(rows-1)*gp,svg:out}}
function hstack(items,gap,align){const H=Math.max(...items.map(b=>b.h));let x=0,out='';for(const b of items){const y=align==='bottom'?H-b.h:(H-b.h)/2;out+=`<g transform="translate(${x},${y})">${b.svg}</g>`;x+=b.w+gap}return{w:x-gap,h:H,svg:out}}
function vstack(items,gap){const W=Math.max(...items.map(b=>b.w));let y=0,out='';for(const b of items){out+=`<g transform="translate(${(W-b.w)/2},${y})">${b.svg}</g>`;y+=b.h+gap}return{w:W,h:y-gap,svg:out}}

 $('cvLead').textContent=t(CONFIG.anon?'cvLeadA':'cvLead');
 if(CONFIG.anon){$('cvAu').innerHTML=`<span class="role">${t('cv48')}</span><div class="nm" style="font-size:56px;font-family:var(--mono)">48</div>`+['rom','egy','may','bab'].map(x=>`<div class="cv48" style="--c:var(--c-${x})"><span>${tn(x)}</span><span class="g">${glyphs(x,48)}</span><b>${count(x,48)}</b></div>`).join('')}else
 $('cvAu').innerHTML=`${C.coverPhoto?`<div class="cv-portrait"><img src="${C.coverPhoto}" alt="${esc(nm)}"></div>`:`<div class="au-photo">${C.authorPhoto?`<img src="${C.authorPhoto}" alt="${esc(nm)}">`:esc(C.name[LANG][0])}</div>`}<span class="role">${t('cvRole')}</span><div class="nm">${esc(nm)}</div><div class="sub">${esc(C.gradeLabel[LANG])}<br>${esc(C.school[LANG])}${C.city[LANG]?'<br>'+esc(C.city[LANG]):''}</div>${C.supervisor[LANG]?`<div class="cv-sup">${C.supervisorPhoto?`<img src="${C.supervisorPhoto}" alt="${esc(C.supervisor[LANG])}">`:''}<div><span class="role">${t('cvSup')}</span><b>${esc(C.supervisor[LANG])}</b><span>${esc(C.supervisorRole[LANG])}</span></div></div>`:''}`;
 $('cvRes').innerHTML=`<b style="color:var(--c-dec)">192</b><span class="vs">vs</span><b style="color:var(--c-egy)">901</b><p>${t('cvRes')}</p>`;
 $('cvTiles').innerHTML=T.cvT.map(x=>`<a class="cv-tile" href="${x[0]}"><i>${x[1]}</i><span><b>${x[2+k]}</b>${x[4+k]}</span></a>`).join('')}

/* ===== Автор ===== */
function renderAuthor(){const k=li(),C=CONFIG,nm=(C.surname[LANG]?C.surname[LANG]+' ':'')+C.name[LANG];
 $('auPhoto').innerHTML=C.authorPhoto?`<img src="${C.authorPhoto}" alt="${esc(nm)}">`:esc(C.name[LANG][0]);
 $('auId').innerHTML=`<div class="au-name">${esc(nm)}</div><p class="mute" style="margin-top:6px">${esc(C.gradeLabel[LANG])} · ${C.age} ${t('auAge')}${C.school[LANG]?' · '+esc(C.school[LANG]):''}${C.city[LANG]?' · '+esc(C.city[LANG]):''}</p>`;
 const F=[[C.age,t('fAge')],[C.grade,t('fGrade')],[6,t('fWeeks')],[500,t('fRec')],[5,t('fSys')],[20,t('fExp')]];
 $('auFacts').innerHTML=F.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
 $('auStory').innerHTML=T.auStory.map(p=>`<p>${p[k]}</p>`).join('');
 $('auPath').innerHTML=T.auPath.map(p=>`<div><time>${p[0]}</time><p class="small">${p[1+k]}</p></div>`).join('');
 $('auCard').innerHTML=T.auCard.map(r=>`<tr><td>${r[k]}</td><td style="white-space:normal;text-align:left">${r[2+k]}</td></tr>`).join('')+(C.supervisor[LANG]?`<tr><td>${t('auSup')}</td><td style="white-space:normal;text-align:left"><span class="sup-row">${C.supervisorPhoto?`<img src="${C.supervisorPhoto}" alt="">`:''}<span>${esc(C.supervisor[LANG])}<br><small>${esc(C.supervisorRole[LANG])}</small></span></span></td></tr>`:'');
 $('auQuote').innerHTML=`${t('auQuote')}<small>— ${t('auQuoteBy')}</small>`;
 const ints=C.interests[LANG]||[];$('auIntBox').hidden=!ints.length;$('auInt').innerHTML=ints.map(x=>`<span>${esc(x)}</span>`).join('')}

/* ===== 9. Зерттеу туралы ===== */
function renderAbout(){const r=study(100),k=li();
 $('aSteps').innerHTML=T.aDidL.map(s=>`<li>${s[k]}</li>`).join('');
 const rows=[['dec',10],['rom',7],['egy',4],['may',3],['bab',2]];
 $('aTable').innerHTML=`<tr><th>${t('thSys')}</th><th>${k?'Разных знаков':'Әртүрлі таңба'}</th><th>${t('thSym')} 1–100</th><th>${t('thPl')}</th><th>${t('thCost')}</th><th>${k?'Компьютер':'Компьютер'}</th></tr>`+
  rows.map(([s,d])=>`<tr style="--c:var(--c-${s})"><td><span class="dot"></span>${tn(s)}</td><td>${d}</td><td>${r[s].sym}</td><td>${r[s].pl}</td><td>${dec2(r[s].cost)}</td><td style="color:var(--ok)">✓</td></tr>`).join('');
 $('aConclL').innerHTML=T.aConclL.map(s=>`<li>${s[k]}</li>`).join('');$('aLearnL').innerHTML=T.aLearnL.map(s=>`<li>${s[k]}</li>`).join('');
 $('aDiaryL').innerHTML=DIARY.map(d=>`<div><time>${d[0]}.2026</time><p class="small">${d[1]}</p></div>`).join('');
 $('aAchL').innerHTML=CONFIG.achievements.map(a=>`<div><b>${a.d}</b><span>${esc(a[LANG])}</span></div>`).join('');
 $('aPhotosL').innerHTML=CONFIG.photos.length?CONFIG.photos.map(p=>`<figure style="margin:0"><div class="ph" style="border-style:solid"><img src="${esc(p.src)}" alt="${esc(p[LANG]||'')}"></div><figcaption class="small mute">${esc(p[LANG]||'')}</figcaption></figure>`).join(''):
  CONFIG.photoSlots.map(p=>`<div class="ph"><div><span>📷</span><span>${esc(p[LANG])}</span><span class="small">${t('phEmpty')}</span></div></div>`).join('')}

/* ===== QR ===== */
function showQR(){const url=location.href.split('#')[0];try{const q=qrcode(0,'M');q.addData(url);q.make();$('qrBox').innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){$('qrBox').textContent='QR'}$('qrUrl').textContent=url;$('qrOv').hidden=false}

/* ===== Іске қосу ===== */
function init(){
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;store.set('zerde-lang',LANG);applyLang()});
 $('numIn').addEventListener('input',e=>{const s=e.target.value.replace(/\D/g,'').slice(0,12);if(e.target.value!==s)e.target.value=s;if(s===''){return}NUM=Math.min(+s,LIMIT.dec);renderConvert();renderBases()});
 document.addEventListener('click',e=>{const c=e.target.closest('[data-n]');if(c){setNum(+c.dataset.n);return}
  const ks=e.target.closest('[data-ks]');if(ks){KS=ks.dataset.ks;KTOAST='';renderKeys();return}
  const k=e.target.closest('[data-k]');if(k&&k.closest('#kKeys')){KS==='rom'?kTap(k.dataset.k):KS==='egy'?kTap(+k.dataset.k):kTap(+k.dataset.k,+k.dataset.a);return}
  if(e.target.closest('[data-addplace]')){kAddPlace();return}
  const rk=e.target.closest('[data-rk]');if(rk){rKey(rk.dataset.rk);return}
  if(e.target.id==='rGo')rStart();if(e.target.id==='rOk')rCheck();if(e.target.id==='rNew'){RC={phase:'idle'};renderRace()}});
 $('kBack').onclick=()=>{if(KHIST.length){KB=JSON.parse(KHIST.pop());KTOAST='';renderKeys()}};
 $('kClear').onclick=()=>{kPush();KB={egy:[0,0,0,0,0,0,0],rom:'',may:[0],bab:[0]};KTOAST='';renderKeys()};
 $('nRange').addEventListener('input',()=>requestAnimationFrame(renderStudy));
 $('bRange').addEventListener('input',renderBases);
 $('rReset').onclick=()=>{if(!RARM){RARM=true;renderRace();setTimeout(()=>{RARM=false;renderRace()},4000);return}store.set('zerde-race','[]');RARM=false;renderRace()};
 $('wPrev').onclick=()=>{WA+=18;renderWheel(true)};$('wNext').onclick=()=>{WA-=18;renderWheel(true)};
 const ws=$('wheelSvg');ws.addEventListener('pointerdown',e=>{if(WSPIN){cancelAnimationFrame(WSPIN);WSPIN=null}WDRAG={a:wAngle(e),w:WA,s:[[performance.now(),WA]]};ws.setPointerCapture(e.pointerId)});
 ws.addEventListener('pointermove',e=>{if(!WDRAG)return;const ang=wAngle(e);let d=ang-WDRAG.a;if(d>180)d-=360;if(d<-180)d+=360;WDRAG.a=ang;WA+=d;WDRAG.s.push([performance.now(),WA]);if(WDRAG.s.length>8)WDRAG.s.shift();const r=$('wRot');if(r)r.style.transform=`rotate(${WA}deg)`});
 ws.addEventListener('pointerup',()=>{if(!WDRAG)return;const s=WDRAG.s,a=s[0],b=s[s.length-1],v=(b[1]-a[1])/Math.max(1,b[0]-a[0]);WDRAG=null;if(Math.abs(v)>.12)wSpin(Math.sign(v));else{WA=Math.round(WA/18)*18;renderWheel(true)}});
 $('wSpin').onclick=()=>wSpin(Math.random()<.5?-1:1);
 ws.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){WA-=18;renderWheel(true)}if(e.key==='ArrowLeft'){WA+=18;renderWheel(true)}});ws.tabIndex=0;
 $('gName').addEventListener('input',renderCard);$('gYear').addEventListener('input',renderCard);
 $('gSave').onclick=()=>{const cv=$('cardPrev');try{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='zerde-'+($('gYear').value||'2026')+'.png';document.body.appendChild(a);a.click();a.remove();$('gMsg').textContent=t('gSaved')})}catch(e){$('gMsg').textContent=t('gNoSave')}};
 $('qrBtn').onclick=showQR;$('qrBtn2').onclick=showQR;$('qrClose').onclick=()=>$('qrOv').hidden=true;$('qrOv').onclick=e=>{if(e.target.id==='qrOv')$('qrOv').hidden=true};
 document.addEventListener('keydown',e=>{if(e.key==='Escape')$('qrOv').hidden=true;
  if(RC.phase==='run'&&!e.target.closest('input')){const s=RC.order[RC.si],u=e.key.toUpperCase();if(e.key==='Enter')rCheck();else if(e.key==='Backspace')rKey('bk');else if(s==='dec'&&/^\d$/.test(e.key))rKey(e.key);else if(s==='rom'&&'IVXLC'.includes(u)&&u.length===1)rKey(u)}});
 applyLang();setInterval(()=>{if(!document.hidden)renderClock()},1000)}
init();
</script>

</body></html>
